name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.14']
        extras: ['[all]']
        include:
          - os: ubuntu-latest
            python-version: '3.14'
            extras: ''  # core install without GSTools or scikit-learn
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: pyvista/setup-headless-display-action@v4
      - run: uv venv && uv pip install -e ".${{ matrix.extras }}" pytest
      - run: uv run --no-sync pytest --doctest-modules src tests
