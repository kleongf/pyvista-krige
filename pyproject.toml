[build-system]
build-backend = 'hatchling.build'
requires = ['hatchling']

[project]
name = 'pyvista-krige'
version = '0.1.0.dev0'
description = 'Kriging for PyVista datasets, powered by PyKrige.'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.11'
authors = [{name = 'Kevin Fong'}]
classifiers = [
  'Development Status :: 3 - Alpha',
  'Intended Audience :: Science/Research',
  'Programming Language :: Python :: 3',
  'Topic :: Scientific/Engineering :: GIS',
  'Topic :: Scientific/Engineering :: Visualization',
]
dependencies = [
  'numpy>=1.22',
  'pykrige>=1.7',
  'pyvista>=0.48',
  'scipy>=1.5.4',
]

[project.optional-dependencies]
all = ['pyvista-krige[gstools,sklearn]']
gstools = ['gstools>=1.5']
sklearn = ['scikit-learn>=1.0']

[project.entry-points."pyvista.accessors"]
krige = 'pyvista_krige._accessor'

[project.entry-points."pyvista.plotter_components"]
krige = 'pyvista_krige._component'

[dependency-groups]
test = ['pytest>=8', 'pytest-cov']

[tool.hatch.build.targets.wheel]
packages = ['src/pyvista_krige']

[tool.pytest.ini_options]
addopts = ['--strict-markers']
filterwarnings = ['error']
testpaths = ['tests']

[tool.ruff]
line-length = 99

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 75
quote-style = 'single'

[tool.ruff.lint]
extend-select = [
  'B',
  'C4',
  'D',
  'E',
  'EM',
  'F',
  'FBT001',
  'FBT002',
  'I',
  'NPY',
  'PLC0415',
  'PT',
  'RET',
  'RUF',
  'SIM',
  'UP',
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
'*.pyi' = ['B032']  # bare annotations declare the runtime-registered attributes
'examples/*' = ['D']
'tests/*' = ['D', 'PLC0415']  # optional-dependency imports stay inside skippable tests

[tool.ruff.lint.pydocstyle]
convention = 'numpy'
